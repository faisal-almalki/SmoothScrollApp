name: Branch Build

# Compile check for work-in-progress branches. Debug only, so it needs no signing secrets.
on:
  push:
    branches: [ "claude/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # So the branch can be tried on a real phone without a build environment:
      # download the artifact from this run's page and install it. Debug builds
      # are signed with Android's shared debug key, which is fine for testing and
      # is exactly why this needs none of the release secrets.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: smoothscroll-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Applies the migrations to a real Postgres (PGlite, in-process) and
      # exercises the app's queries and constraints. Needs no database.
      - name: Verify schema
        run: npm run db:verify
